<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta — Earth Jukebox</title>
  <link rel="stylesheet" href="../styles/main.css" />
<script src="../config.js"></script>\n</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◉</span><span class="brand-name">Earth Jukebox</span></div>
    <nav class="site-nav" aria-label="Principal">
      <a href="../index.html">Inicio</a>
      <a href="sounds.html">Sonidos de la Tierra</a>
      <a href="explorer.html">Explorador del Planeta</a>
      <a href="music.html">Música de la Tierra</a>
      <a href="account.html" aria-current="page">Cuenta</a>
    </nav>
  </header>
  <main id="contenido" class="section">
    <h1>Cuenta</h1>
    <p>Registro e inicio de sesión (Supabase). Requiere configurar .env.</p>

    <div class="auth-grid">
      <section class="card">
        <h2>Registro</h2>
        <label>Email <input id="su-email" type="email" /></label>
        <label>Contraseña <input id="su-pass" type="password" /></label>
        <button id="signup" class="btn btn-primary">Registrarse</button>
      </section>
      <section class="card">
        <h2>Iniciar sesión</h2>
        <label>Email <input id="li-email" type="email" /></label>
        <label>Contraseña <input id="li-pass" type="password" /></label>
        <button id="login" class="btn btn-primary">Entrar</button>
      </section>
    </div>
    <section class="card" style="margin-top:1rem">
      <h2>Perfil</h2>
      <button id="me" class="btn btn-secondary">Consultar perfil</button>
      <pre id="profile" class="code-block"></pre>
    </section>
  </main>
  <footer class="site-footer"><p>© Earth Jukebox</p></footer>
  <script type="module" src="../scripts/pages/account.js"></script>
</body>
</html>
